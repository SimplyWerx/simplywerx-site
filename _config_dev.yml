# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# theme: jekyll-agency

url: "http://localhost:4000"
baseurl: ""

title      : SimplyWerx Pte Ltd
email      : feedback@simplywerx.com #this is also the email contact forms will go to
description: "SimplyWerx Pte Ltd designs and builds robust interactive exhibits, custom electronics, mechanical systems, and mobile apps for museums, education, and public spaces."
tagline: "Robust interactive systems, built for real-world use"
author     : "SimplyWerx Pte Ltd"
logo: "/assets/img/logo.png" #used by jekyll-seo-tag and templates
logo_height: 111 #height in px, defaults to 52px

social:
  name: SimplyWerx Pte Ltd
  links:
    - https://simplywerx.com

locale: "en-US" # See available languages in _data/sitetext.yml

analytics:
  google: #Google Analytics tracking code here

collections:
  portfolio:

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/logo.png
  - scope:
      path: ""
      type: pages
    values:
      description: "SimplyWerx Pte Ltd builds reliable interactive systems, exhibits, and digital products for public-facing environments."

markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Web3Forms Access Key for   form submissions
web3forms_access_key: "9d6128c8-d6e9-4d6a-a8b8-983bd0b45e4d"
