en: &DEFAULT_EN
  header:
    title: "You dream it. We bring it to life."
    text: "Technology and custom hardware for interactive exhibits.<br>We supply the electronics, mechanisms, and software behind reliable interactive experiences."
    button: Explore Services
    buttonlink: "#services"

  services:
    title: "How We Support Designers"
    text: "We help design studios and fabricators deliver dependable interactives with custom electronics, mechanical systems, and control software that integrate smoothly into your builds."
    section: services
    list:
      - title: "Custom Electronics Engineering"
        desc: "We engineer the electronics behind responsive interactives, from sensors and control systems to embedded logic and interfaces. From **system architecture** and **schematic design** to **PCB layout**, fabrication, and validation, we deliver reliable subsystems your team can integrate with confidence."
        icon: fas fa-microchip #find more at https://fontawesome.com/icons
      - title: "Mechanical Engineering for Interactive Mechanisms"
        desc: "We design and build the physical layer of interactive installations so they feel intuitive and hold up under heavy use. Using **CAD modeling**, **simulation**, and rapid prototyping with **3D printing** and **CNC fabrication**, we deliver robust mechanisms and assemblies ready for real-world operation."
        icon: fas fa-robot
      - title: "Control Software & Mobile App Development"
        desc: "We build intuitive, scalable **control software** and **mobile applications** that complement your exhibits and installations. Our team delivers native and **cross‑platform** apps with dependable performance, plus clear handover documentation for your operations team."
        icon: fab fa-android

  portfolio:
    title: "Recent Works"
    text: "Some of our recent projects"
    section: portfolio
    closebutton: "Close Project"

  about:
    title: "Team SimplyWerx"
    text: "Your specialist technology partner"
    body: "SimplyWerx is a close‑knit team of engineers, makers, and designers led by Hon Tat Lau and Muliono Tanuwidjaja. We’re based in Singapore, and between us we bring more than 40 years of hands‑on experience delivering robust interactive technology.<br>We collaborate with design studios and fabricators as a specialist supplier. Our systems are engineered for demanding public environments and handed over with practical documentation to support high uptime, easy maintenance, and smooth long-term operation."
    section: about

