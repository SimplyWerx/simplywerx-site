    closebutton: "Close Project"

  about:
    title: "Team SimplyWerx"
    text: "The people behind the work"
    body: "SimplyWerx is a close‑knit team of engineers, makers, and designers led by Hon Tat Lau and Muliono Tanuwidjaja. We’re based in Singapore, and between us we bring more than 40 years of hands‑on experience turning rough ideas into things people can see, touch, and use.<br>We’re not a hobbyist or DIY maker setup. Our installations are engineered for demanding, real‑world environments — robust, production‑grade, and battle‑tested through repeated public use. Clients trust us because we combine practical problem‑solving with disciplined execution from first sketch to final handover, designing every system for easy maintenance, high uptime, and minimal downtime."
    section: about

