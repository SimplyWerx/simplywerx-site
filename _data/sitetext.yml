  header:
    title: "You dream it. We bring it to life."
    text: "Engineering creativity into reality:<br>devices, apps, and experiences that inspire and engage."
    button: Tell Me More
    buttonlink: "#services"

  services:
    title: "What We Do"
    text: "From concept to deployment, we design and build integrated hardware, software, and interactive experiences."
    section: services
    list:
      - title: "Full‑Stack Electronics Engineering"
        desc: "We engineer the electronics behind responsive interactives, from sensors and control systems to embedded logic and interfaces. From **system architecture** and **schematic design** to **PCB layout**, fabrication, and validation, we deliver complete platforms that respond smoothly, recover quickly, and run reliably throughout daily public operation."
        icon: fas fa-microchip #find more at https://fontawesome.com/icons
      - title: "Mechanical Engineering & Interactive Systems Design"
        desc: "We design and build the physical layer of interactive installations so they feel intuitive and hold up under heavy use. Using **CAD modeling**, **simulation**, and rapid prototyping with **3D printing** and **CNC fabrication**, we produce museum-grade mechanisms and touchpoints that are precise, safe, and built for repeated interaction."
        icon: fas fa-robot
      - title: "Full‑Stack Mobile App Development"
        desc: "We build intuitive, scalable **mobile applications** from product design to release. Our team delivers native and **cross‑platform** apps with clean user flows and dependable performance. With over **10 million Google Play downloads**, our products are proven in real‑world use across consumer, exhibit companion, and enterprise applications."
        icon: fab fa-android

  portfolio:
