<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}">

  {% include head.html %}

  <body id="page-top">

      {{ content }}

			{% assign whatsapp_number = site.whatsapp_number | default: "6580892976" %}
			{% assign whatsapp_message = site.whatsapp_message | default: "Hi, I would like to discuss a project." | uri_escape %}
			<a
				class="whatsapp-float"
				id="whatsapp-float"
				href="https://wa.me/{{ whatsapp_number }}?text={{ whatsapp_message }}"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="Chat with us on WhatsApp"
				hidden
			>
				<i class="fab fa-whatsapp"></i>
			</a>
			<script>
				(function() {
					var whatsappButton = document.getElementById('whatsapp-float');
					if (!whatsappButton) {
						return;
					}

					var searchParams = new URLSearchParams(window.location.search);
					if (searchParams.get('ad') === 'sg') {
						whatsappButton.hidden = false;
					}
				})();
			</script>

	  {% include footer.html %}

	  <!-- Bootstrap core JavaScript -->
	  <script src="assets/js/jquery.min.js"></script>
	  <script src="assets/js/bootstrap.bundle.min.js"></script>

	  <!-- Plugin JavaScript -->
	  <script src="assets/js/jquery.easing.min.js"></script>

	  <!-- Contact form JavaScript -->
	  <script src="assets/js/jqBootstrapValidation.js"></script>
	  <script src="assets/js/contact_me_web3forms.js"></script>

	  <!-- Custom scripts for this template -->
	  <script src="assets/js/agency.min.js"></script>

	  <!-- Scattered photos effect -->
	  <script src="assets/js/photo-list.js"></script>
	  <script src="assets/js/scattered-photos.js"></script>

  </body>
</html>
